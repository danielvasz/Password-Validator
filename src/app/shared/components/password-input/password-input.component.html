<mat-form-field appearance="outline">
    <mat-label>{{changeTitle(typePassword)}}</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" [formControl]="formController">
    <button mat-icon-button matIconSuffix (click)="clickEvent($event)" [disabled]="disabeButton">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
    <mat-error>{{errorMessage()}}</mat-error>
</mat-form-field>
